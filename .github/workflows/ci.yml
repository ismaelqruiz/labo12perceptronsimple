name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest -v

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.8.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=ismaelqruiz
            -Dsonar.projectKey=ismaelqruiz_labo12perceptronsimple